schema_version: extension_descriptor_v1
extension_id: com.discogs.api
release_version: 0.2.4
extension_type: service_extension
identity:
  display_name: Discogs API
  description: 'Research record releases, enrich a music catalog and manage Discogs account tasks from Flow Steward
    workflows. Search releases, masters, artists and labels using filters such as artist, release title, year, barcode
    or catalog number. Look up individual records, explore master versions and artist or label releases, and return
    result objects with pagination for subsequent workflow steps.


    Marketplace operations cover listings, release sales statistics, price suggestions, fee calculations, orders
    and order messages. Collection and wantlist operations let workflows inspect folders, release instances and
    custom collection fields, then add, update or remove supported items. The release also exposes user profiles,
    contributions, submissions, lists, release ratings and inventory export or upload operations.


    Use these functions to enrich a record catalog, research a pressing, compare collection holdings against a wantlist,
    or connect record-selling tasks to other systems. Write operations require a token, explicit enablement and
    confirmation. Discogs permissions and rate limits still apply. This is a Flow Steward-maintained integration
    with Discogs; the returned marketplace information does not itself place a purchase.'
  tags:
  - music
  - catalog
  - marketplace
  - discogs
vendor:
  vendor_name: Discogs
  support_url: https://www.discogs.com/developers/
listing:
  visibility: private_reference
  category: data_enrichment
distribution:
  channel: private_byo
  execution_modes:
    - local
  allows_self_hosted: true
  requires_connected_control_plane: false
  import_sources:
    - file
runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.0.0
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    resource_query_manifest: contracts/resource_query_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifacts:
  extensions:
    - extension_id: com.discogs.api
      ref: extension.yaml
      publish: true
  workflows:
    - workflow_id: discogs_search_vinyl_releases
      ref: artifacts/workflows/discogs_search_vinyl_releases.yaml
      publish: true
    - workflow_id: discogs_artist_profile_and_releases
      ref: artifacts/workflows/discogs_artist_profile_and_releases.yaml
      publish: true
provenance:
  origin: user_generated
commerce:
  billing_mode: free
