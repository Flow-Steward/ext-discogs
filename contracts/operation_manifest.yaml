operations:
  - operation_id: discogs_identity
    display_name: "Get the connected Discogs account"
    description: "Read the username and account details associated with the saved Discogs token."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_account
    inputs:
      - {name: "user_token", value_type: text, required: false}
    outputs:
      - {name: "result.data.username", value_type: object}
    result_fields: ["result.data.username"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_search_database
    display_name: "Search the Discogs music database"
    description: "Find releases, masters, artists or labels using text and music catalog filters. Returns one page of matches; use a release ID from the results to look up a particular pressing."
    operation_kind: source
    category: discogs_database
    inputs:
      - {name: "query", value_type: text, required: false}
      - {name: "type", value_type: text, required: false}
      - {name: "artist", value_type: text, required: false}
      - {name: "release_title", value_type: text, required: false}
      - {name: "label", value_type: text, required: false}
      - {name: "year", value_type: integer, required: false}
      - {name: "barcode", value_type: text, required: false}
      - {name: "catno", value_type: text, required: false}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
    outputs:
      - {name: "result.data.results[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
      - {name: "result.data.result_count", value_type: integer}
      - {name: "result.data.results_json", value_type: text}
    result_fields: ["result.data.results[]", "result.data.pagination", "result.data.result_count", "result.data.results_json"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_release
    display_name: "Get a record release"
    description: "Read one specific release or pressing by its Discogs release ID, including the metadata returned by Discogs."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "release_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.data.title", value_type: object}
    result_fields: ["result.data.id", "result.data.title"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_release_rating
    display_name: "Get an account’s release rating"
    description: "Read the selected account’s personal rating for a specific release; this is separate from community statistics."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "release_id", value_type: integer, required: true}
      - {name: "username", value_type: text, required: false}
    outputs:
      - {name: "result.data.rating", value_type: object}
    result_fields: ["result.data.rating"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_update_release_rating
    display_name: "Set an account’s release rating"
    description: "Save the selected account’s personal rating for a release. Requires a token, enabled write actions and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "release_id", value_type: integer, required: true}
      - {name: "username", value_type: text, required: false}
      - {name: "rating", value_type: integer, required: true}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_delete_release_rating
    display_name: "Remove an account’s release rating"
    description: "Remove the selected account’s personal rating for a release. Requires a token, enabled write actions and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "release_id", value_type: integer, required: true}
      - {name: "username", value_type: text, required: false}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_release_stats
    display_name: "Get release collection and wantlist statistics"
    description: "Read community collection and wantlist statistics for a release to support music catalog research."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "release_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data", value_type: object}
    result_fields: ["result.data"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_master
    display_name: "Get a master release"
    description: "Read the master record that groups editions of an album or single. A master ID is different from a particular release ID."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "master_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.data.title", value_type: object}
    result_fields: ["result.data.id", "result.data.title"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_master_versions
    display_name: "List editions of a master release"
    description: "Read one page of releases grouped under a master. Narrow by format, label, country or release date to identify a pressing."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "master_id", value_type: integer, required: true}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
      - {name: "format", value_type: text, required: false}
      - {name: "label", value_type: text, required: false}
      - {name: "released", value_type: text, required: false}
      - {name: "country", value_type: text, required: false}
      - {name: "sort", value_type: text, required: false}
      - {name: "sort_order", value_type: text, required: false}
    outputs:
      - {name: "result.data.versions[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.results[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_artist
    display_name: "Get an artist"
    description: "Read a Discogs artist profile using an artist ID from search results."
    operation_kind: source
    category: discogs_database
    inputs:
      - {name: "artist_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.data.name", value_type: object}
    result_fields: ["result.data.id", "result.data.name"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_artist_releases
    display_name: "List an artist’s releases"
    description: "Read one page of releases associated with a Discogs artist for discography research."
    operation_kind: source
    category: discogs_database
    inputs:
      - {name: "artist_id", value_type: integer, required: true}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
      - {name: "sort", value_type: text, required: false}
      - {name: "sort_order", value_type: text, required: false}
    outputs:
      - {name: "result.data.releases[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.releases[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_label
    display_name: "Get a record label"
    description: "Read a Discogs record label profile using its label ID."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "label_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.data.name", value_type: object}
    result_fields: ["result.data.id", "result.data.name"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_label_releases
    display_name: "List a label’s releases"
    description: "Read one page of releases associated with a Discogs record label."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_database
    inputs:
      - {name: "label_id", value_type: integer, required: true}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
    outputs:
      - {name: "result.data.releases[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.releases[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_marketplace_listing
    display_name: "Get a marketplace sale listing"
    description: "Read one seller listing by listing ID, including the price and condition returned by Discogs. A listing ID is different from a release ID."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "listing_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.data.price", value_type: object}
    result_fields: ["result.data.id", "result.data.price"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_create_marketplace_listing
    display_name: "Create a marketplace sale listing"
    description: "Offer a specific release for sale using its condition, price and listing details. Creates a real seller listing and requires enabled writes and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "release_id", value_type: integer, required: true}
      - {name: "condition", value_type: text, required: true}
      - {name: "sleeve_condition", value_type: text, required: false}
      - {name: "price", value_type: number, required: true}
      - {name: "status", value_type: text, required: false}
      - {name: "comments", value_type: text, required: false}
      - {name: "allow_offers", value_type: boolean, required: false}
      - {name: "external_id", value_type: text, required: false}
      - {name: "location", value_type: text, required: false}
      - {name: "weight", value_type: number, required: false}
      - {name: "format_quantity", value_type: integer, required: false}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.data.id", "result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_update_marketplace_listing
    display_name: "Update a marketplace sale listing"
    description: "Change the price, condition or other supplied details of an existing seller listing. Requires enabled writes and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "listing_id", value_type: integer, required: true}
      - {name: "release_id", value_type: integer, required: false}
      - {name: "condition", value_type: text, required: false}
      - {name: "sleeve_condition", value_type: text, required: false}
      - {name: "price", value_type: number, required: false}
      - {name: "status", value_type: text, required: false}
      - {name: "comments", value_type: text, required: false}
      - {name: "allow_offers", value_type: boolean, required: false}
      - {name: "external_id", value_type: text, required: false}
      - {name: "location", value_type: text, required: false}
      - {name: "weight", value_type: number, required: false}
      - {name: "format_quantity", value_type: integer, required: false}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_delete_marketplace_listing
    display_name: "Delete a marketplace sale listing"
    description: "Remove an existing seller listing by listing ID. Requires enabled writes and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "listing_id", value_type: integer, required: true}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_marketplace_stats
    display_name: "Get release marketplace statistics"
    description: "Read marketplace availability and pricing statistics for a release to support pricing research."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "release_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data.lowest_price", value_type: object}
      - {name: "result.data.num_for_sale", value_type: object}
    result_fields: ["result.data.lowest_price", "result.data.num_for_sale"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_price_suggestions
    display_name: "Get suggested sale prices by condition"
    description: "Read Discogs price suggestions for a release by condition. These are suggestions, not a change to your listings."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "release_id", value_type: integer, required: true}
    outputs:
      - {name: "result.data", value_type: object}
    result_fields: ["result.data"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_calculate_marketplace_fee
    display_name: "Estimate a marketplace sale fee"
    description: "Calculate the Discogs marketplace fee for a proposed price and currency without creating a listing or order."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_marketplace
    inputs:
      - {name: "price", value_type: number, required: true}
      - {name: "currency", value_type: text, required: false}
    outputs:
      - {name: "result.data", value_type: object}
    result_fields: ["result.data"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_list_orders
    display_name: "List marketplace orders"
    description: "Read one page of the connected account’s marketplace orders, optionally filtered by status, creation date and archive state."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_orders
    inputs:
      - {name: "status", value_type: text, required: false}
      - {name: "created_after", value_type: text, required: false}
      - {name: "created_before", value_type: text, required: false}
      - {name: "archived", value_type: boolean, required: false}
      - {name: "sort", value_type: text, required: false}
      - {name: "sort_order", value_type: text, required: false}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
    outputs:
      - {name: "result.data.orders[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.orders[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_order
    display_name: "Get a marketplace order"
    description: "Read an existing marketplace order by its Discogs order ID for fulfillment or reporting."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_orders
    inputs:
      - {name: "order_id", value_type: text, required: true}
    outputs:
      - {name: "result.data.id", value_type: object}
      - {name: "result.data.status", value_type: object}
    result_fields: ["result.data.id", "result.data.status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_update_order
    display_name: "Update a marketplace order"
    description: "Change the supplied status, shipping amount or archive state of an existing order. Requires enabled writes and confirmation; Discogs controls allowed status transitions."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_orders
    inputs:
      - {name: "order_id", value_type: text, required: true}
      - {name: "status", value_type: text, required: false}
      - {name: "shipping", value_type: number, required: false}
      - {name: "archived", value_type: boolean, required: false}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_list_order_messages
    display_name: "Read marketplace order messages"
    description: "Read the message history for an existing Discogs marketplace order."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_orders
    inputs:
      - {name: "order_id", value_type: text, required: true}
    outputs:
      - {name: "result.data.messages[]", value_type: object}
    result_fields: ["result.data.messages[]"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_add_order_message
    display_name: "Send a marketplace order message"
    description: "Post a message on an existing order, optionally with a status value. Sends a real order message and requires enabled writes and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_orders
    inputs:
      - {name: "order_id", value_type: text, required: true}
      - {name: "message", value_type: text, required: true}
      - {name: "status", value_type: text, required: false}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
      - {name: "result.provider_status", value_type: object}
    result_fields: ["result.provider_status"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_user_profile
    display_name: "Get a Discogs user profile"
    description: "Read the profile of the named Discogs account."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_user
    inputs:
      - {name: "username", value_type: text, required: true}
    outputs:
      - {name: "result.data.username", value_type: object}
    result_fields: ["result.data.username"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_user_submissions
    display_name: "List a user’s database submissions"
    description: "Read one page of music database submissions associated with the named Discogs account."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_user
    inputs:
      - {name: "username", value_type: text, required: true}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
    outputs:
      - {name: "result.data.submissions[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.submissions[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_user_contributions
    display_name: "List a user’s database contributions"
    description: "Read one page of music database contributions associated with the named Discogs account."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_user
    inputs:
      - {name: "username", value_type: text, required: true}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
      - {name: "sort", value_type: text, required: false}
      - {name: "sort_order", value_type: text, required: false}
    outputs:
      - {name: "result.data.contributions[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.contributions[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_user_lists
    display_name: "List a user’s saved lists"
    description: "Read one page of lists belonging to the named Discogs account."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_user
    inputs:
      - {name: "username", value_type: text, required: true}
      - {name: "page", value_type: integer, required: false}
      - {name: "per_page", value_type: integer, required: false}
    outputs:
      - {name: "result.data.lists[]", value_type: object}
      - {name: "result.data.pagination", value_type: object}
    result_fields: ["result.data.lists[]", "result.data.pagination"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_get_collection_folders
    display_name: "List record collection folders"
    description: "Read the named account’s collection folders and their IDs before selecting a folder in another collection action."
    operation_kind: source
    connection_type_ids: [discogs_token_account]
    category: discogs_collection
    inputs:
      - {name: "username", value_type: text, required: false}
    outputs:
      - {name: "result.data.folders[]", value_type: object}
    result_fields: ["result.data.folders[]"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed, provider_not_found, rate_limited]
  - operation_id: discogs_create_collection_folder
    display_name: "Create a record collection folder"
    description: "Create a named folder in the account’s record collection. Requires enabled writes and confirmation."
    operation_kind: action
    connection_type_ids: [discogs_token_account]
    category: discogs_collection
    inputs:
      - {name: "username", value_type: text, required: false}
      - {name: "name", value_type: text, required: true}
      - {name: "confirm", value_type: boolean, required: true}
    outputs:
