$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [release_id, confirm]
properties:
  username:
    type: string
  folder_id:
    type: integer
    minimum: 0
  release_id:
    type: integer
    minimum: 1
  instance_id:
    type: integer
    minimum: 1
  notes:
    type: string
  rating:
    type: integer
    minimum: 0
    maximum: 5
  confirm:
    type: boolean
    const: true
