manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: com.discogs.api
kind: tool_provider
version: 0.2.3
display_name: Discogs API
description: |-
  Research record releases, enrich a music catalog and manage Discogs account tasks from Flow Steward workflows. Search releases, masters, artists and labels using filters such as artist, release title, year, barcode or catalog number. Look up individual records, explore master versions and artist or label releases, and return result objects with pagination for subsequent workflow steps.

  Marketplace operations cover listings, release sales statistics, price suggestions, fee calculations, orders and order messages. Collection and wantlist operations let workflows inspect folders, release instances and custom collection fields, then add, update or remove supported items. The release also exposes user profiles, contributions, submissions, lists, release ratings and inventory export or upload operations.

  Use these functions to enrich a record catalog, research a pressing, compare collection holdings against a wantlist, or connect record-selling tasks to other systems. Write operations require a token, explicit enablement and confirmation. Discogs permissions and rate limits still apply. This is a Flow Steward-maintained integration with Discogs; the returned marketplace information does not itself place a purchase.
author: Flow Steward
vendor_name: Discogs
support_url: https://github.com/Flow-Steward/ext-discogs/issues
website_url: https://github.com/Flow-Steward/ext-discogs
listing:
  category: media
  tags:
  - discogs
  - music
  - records
  - marketplace
  - collection
  - wantlist
  summary: Connect Discogs database, marketplace, collection and wantlist operations to music research and record-selling
    workflows.
  setup_summary: Configure a project Discogs connection with a user token and the account username where needed;
    self-hosted runtimes can also supply a Discogs token through supported environment variables. Enable write actions
    only when needed and supply confirmation for each modifying operation.
features:
  - tool
  - action
  - query
required_scopes:
  - extension:invoke
  - read:projects
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
  input:
    type: object
    properties:
      action:
        type: string
      query:
        type: string
  output:
    type: object
    properties:
      ok:
        type: boolean
      result:
        type: object
      errors:
        type: array
    required:
      - ok
machine_auth:
  service_account_key: svc_ext_discogs_api
  required_scopes:
    - extension:invoke
account_scope:
  scope_type: project
  description: Discogs API settings, secrets, and workflow operations are configured per project.
entrypoint:
  mode: subprocess
  command:
    - python3
    - main.py
  timeout_seconds: 30
health:
  command:
    - python3
    - health.py
  timeout_seconds: 10
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    resource_query_manifest: contracts/resource_query_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
