    handler:
      mode: extension
      config:
        provider_key: discogs
        required_provider_secrets:
          - user_token
    result_fields: ["result"]
    error_codes: [invalid_payload, authentication_required, write_actions_disabled, confirmation_required, provider_request_failed]
    mutates_platform: false
  - action_id: save_secrets
    workflow_visible: false
    title: "Save secrets"
    description: "Persist Discogs provider secret values."
    required_scopes: [extension:invoke]
    handler:
      mode: platform
      operation: provider_secrets_save
      config:
        provider_key: discogs
        secret_fields:
          - input: user_token
            secret_key: user_token
    parameters:
      - name: user_token
        type: string
        required: false
        description: Discogs user token to store for the selected project.
    result_fields: ["message", "saved_keys"]
