component_id: discogs_capabilities_intro
type: markdown
title: Discogs workflow actions
content: |
  Discogs API functions are exposed as workflow actions, not as manual API forms inside this extension UI.

  Use Workflow -> Add step -> Action source: Discogs API to add these operations.

  Every action also returns `result.rate_limit` with `limit`, `used` and `remaining` from Discogs’ X-Discogs-Ratelimit headers, including when Discogs refuses a request with 429, so a workflow can slow down before the limit is reached.
