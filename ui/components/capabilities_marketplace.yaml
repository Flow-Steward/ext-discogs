component_id: discogs_capabilities_marketplace
type: markdown
title: Marketplace
content: |
  **Get a marketplace sale listing**: Read one seller listing by listing ID, including the price and condition returned by Discogs. A listing ID is different from a release ID.

  **Create a marketplace sale listing**: Offer a specific release for sale using its condition, price and listing details. Creates a real seller listing and requires enabled writes and confirmation.

  **Update a marketplace sale listing**: Change the price, condition or other supplied details of an existing seller listing. Requires enabled writes and confirmation.

  **Delete a marketplace sale listing**: Remove an existing seller listing by listing ID. Requires enabled writes and confirmation.

  **Get release marketplace statistics**: Read marketplace availability and pricing statistics for a release to support pricing research.

  **Get suggested sale prices by condition**: Read Discogs price suggestions for a release by condition. These are suggestions, not a change to your listings.

  **Estimate a marketplace sale fee**: Calculate the Discogs marketplace fee for a proposed price and currency without creating a listing or order.
