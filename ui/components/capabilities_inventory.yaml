component_id: discogs_capabilities_inventory
type: markdown
title: Inventory
content: |
  **List seller inventory exports**: Read the inventory export jobs available to the connected seller account.

  **Get an inventory export status**: Read metadata and status for an existing seller inventory export using its export ID.

  **Read an inventory export download**: Request the download response for an existing seller inventory export. Returns the provider response through this action’s result; it does not create a workflow file artifact.

  **Submit inventory additions**: Submit the supplied inventory items or CSV value to Discogs’ inventory add endpoint. Requires enabled writes and confirmation; inspect the provider response before assuming processing is complete.

  **Submit inventory changes**: Submit the supplied inventory items or CSV value to Discogs’ inventory change endpoint. Requires enabled writes and confirmation; inspect the provider response before assuming processing is complete.

  **Submit inventory removals**: Submit the supplied inventory items or CSV value to Discogs’ inventory delete endpoint. Requires enabled writes and confirmation; inspect the provider response before assuming processing is complete.
