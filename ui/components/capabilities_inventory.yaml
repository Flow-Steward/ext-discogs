component_id: discogs_capabilities_inventory
type: markdown
title: Inventory
content: |
  **List seller inventory exports**: Read the inventory export jobs available to the connected seller account.

  **Get an inventory export status**: Read metadata and status for an existing seller inventory export using its export ID.

  **Read an inventory export download**: Request the download response for an existing seller inventory export. Returns the provider response through this action’s result; it does not create a workflow file artifact.

  **Submit inventory additions**: Upload a CSV of listings to Discogs’ inventory add endpoint as the file Discogs documents (multipart field upload, inventory.csv). Give exactly one of items (objects turned into the CSV), csv (CSV text) or file (a workflow file with the CSV); columns: release_id, price and media_condition; optional sleeve_condition, comments, accept_offer, location, external_id, weight, format_quantity. An unknown column is refused before anything is sent. Discogs records the submission as an upload: the result reports processing accepted and the upload ID; check the outcome with Get an inventory upload status. Requires enabled writes and confirmation.

  **Submit inventory changes**: Upload a CSV of listings to Discogs’ inventory change endpoint as the file Discogs documents (multipart field upload, inventory.csv). Give exactly one of items (objects turned into the CSV), csv (CSV text) or file (a workflow file with the CSV); columns: release_id and at least one of price, media_condition, sleeve_condition, comments, accept_offer, external_id, location, weight, format_quantity. An unknown column is refused before anything is sent. Discogs records the submission as an upload: the result reports processing accepted and the upload ID; check the outcome with Get an inventory upload status. Requires enabled writes and confirmation.

  **Submit inventory removals**: Upload a CSV of listings to Discogs’ inventory delete endpoint as the file Discogs documents (multipart field upload, inventory.csv). Give exactly one of items (objects turned into the CSV), csv (CSV text) or file (a workflow file with the CSV); columns: listing_id. An unknown column is refused before anything is sent. Discogs records the submission as an upload: the result reports processing accepted and the upload ID; check the outcome with Get an inventory upload status. Requires enabled writes and confirmation.

  **List a seller’s inventory**: Read one page of a seller’s marketplace listings with its pagination. Without the owner’s token only listings that are For Sale are visible.

  **Read a seller’s whole inventory**: Read the seller’s listings page by page, up to 100 per page, checking every page against its pagination so no listing is skipped or repeated. Stops at the time or result-size limit with next_page to continue from, and returns complete true only when the last page was read. If the inventory total changes during the read, the result is incomplete with a warning.

  **Request an inventory export**: Ask Discogs to prepare a CSV export of the seller’s inventory. Discogs only accepts the job: the result reports processing accepted, applied false and the export ID; check it with Get an inventory export status. Requires enabled writes and confirmation.

  **List recent inventory uploads**: Read one page of the seller’s recent inventory uploads with their status and processing results.

  **Get an inventory upload status**: Read the status and processing results of one inventory upload using its upload ID.
