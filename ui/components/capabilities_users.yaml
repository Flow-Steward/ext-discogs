component_id: discogs_capabilities_users
type: markdown
title: Users
content: |
  **Get a Discogs user profile**: Read the profile of the named Discogs account.

  **List a user’s database submissions**: Read one page of music database submissions associated with the named Discogs account.

  **List a user’s database contributions**: Read one page of music database contributions associated with the named Discogs account.

  **List a user’s saved lists**: Read one page of lists belonging to the named Discogs account.
