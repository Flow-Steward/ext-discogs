component_id: discogs_capabilities_database
type: markdown
title: Database
content: |
  **Search the Discogs music database**: Find releases, masters, artists or labels using text and music catalog filters. Returns one page of matches; use a release ID from the results to look up a particular pressing.

  **Get a record release**: Read one specific release or pressing by its Discogs release ID, including the metadata returned by Discogs.

  **Get an account’s release rating**: Read the selected account’s personal rating for a specific release; this is separate from community statistics.

  **Set an account’s release rating**: Save the selected account’s personal rating for a release. Requires a token, enabled write actions and confirmation.

  **Remove an account’s release rating**: Remove the selected account’s personal rating for a release. Requires a token, enabled write actions and confirmation.

  **Get release collection and wantlist statistics**: Read community collection and wantlist statistics for a release to support music catalog research.

  **Get a master release**: Read the master record that groups editions of an album or single. A master ID is different from a particular release ID.

  **List editions of a master release**: Read one page of releases grouped under a master. Narrow by format, label, country or release date to identify a pressing.

  **Get an artist**: Read a Discogs artist profile using an artist ID from search results.

  **List an artist’s releases**: Read one page of releases associated with a Discogs artist for discography research.

  **Get a record label**: Read a Discogs record label profile using its label ID.

  **List a label’s releases**: Read one page of releases associated with a Discogs record label.
